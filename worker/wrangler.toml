# Cloudflare Worker config for "Ask Jay's assistant".
#
# The ANTHROPIC_API_KEY is NOT set here. It is stored as a Worker secret
# (see README-setup.md step 4) so it never enters git or the site bundle.

name = "jj-assistant"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Keeps request logs out of Cloudflare, so no message text is ever stored.
[observability]
enabled = false

# KV namespace backing the persistent daily cap (binding used by src/index.js).
# Create it with:  npx wrangler kv namespace create RATE_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
